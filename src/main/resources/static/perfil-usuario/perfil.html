<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="perfil.css">
    <link rel="icon" href="img/logo-capuz.png" type="image/png">
</head>
<main>

    <header class="avatar">
        <figure class="configuracaoicon">
            <a href="/src/main/resources/static/perfil-usuario/configuracoes.html" target="_blank" title="Configurações">
                <img src="/src/main/resources/static/perfil-usuario/img/iconconfig.png" alt="Configurações">
            </a>
        </figure>

        <figure>
            <div class="avatar-wrapper">
                <img src="/src/main/resources/static/perfil-usuario/img/perfilicon.png" alt="avatar">
            </div>
            <h2 class="nome">NOME</h2>
        </figure>

        <section class="nivel">
            <div class="card-progresso-bonitinho">
                <div class="topo-card">
                    <span class="label-progresso">Progresso do Nível</span>
                    <span class="badge-nivel">Nível 1</span>
                </div>

                <progress class="barra-roxo" value="80" max="100"></progress>

                <div class="rodape-card">
                    <span class="xp-texto">800 / 1000 XP para o próximo nível</span>
                    <span class="porcentagem">80%</span>
                </div>
            </div>
        </section>
    </header>

    <body>

        <section class="geral">
            <section class="stats-container">
                <div class="stat-card">
                    <span class="stat-number">12</span>
                    <span class="stat-label">Lições</span>
                </div>

                <div class="stat-card">
                    <span class="stat-number">3</span>
                    <span class="stat-label">Cursos</span>
                </div>

                <div class="stat-card">
                    <div class="streak-wrapper">
                        <span class="stat-number">7</span>
                        <span class="fire-icon">🔥</span>
                    </div>
                    <span class="stat-label">Sequência</span>
                </div>
            </section>
            <h1>Visão Geral</h1>
            <div class="xp">

                <span>XP Total Acumulado</span>
                <p class="xpp"> 450 XP</p>

                <p class="classificação"> Iniciante</p>


            </div>
            <div class="card-progresso">
                <span>Conquistas</span>
                <figure class="container">
                    <img src="/src/main/resources/static/perfil-usuario/img/medalha ouro.png" width="90">
                    <img src="/src/main/resources/static/perfil-usuario/img/medalha prata.png" alt="90">
                    <img src="/src/main/resources/static/perfil-usuario/img/medalha verde.png" alt="">
                </figure>

            </div>

            <div class="card-curso">

                <p class="aqui">Você está em:</p>
                <progress class="progresso2" value="50" max="100"></progress>
                <p class="esse">Curso sobre Cibersegurança</p>
            </div>
        </section>
        <footer class="rodape">
            <a href="/src/main/resources/static/tela-conquistas/conquistas.html">
                <span class="material-symbols-outlined">
            trophy
        </span>

            </a>
            <a href="/src/main/resources/static/index.html">
                <span class="material-symbols-outlined">
            book_ribbon
        </span>

            </a>
            <a href="/src/main/resources/static/perfil-usuario/perfil.html">
                <span class="material-symbols-outlined">
            person
        </span>

            </a>

        </footer>
    </body>



</main>

</html>
