<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="perfil.css">
    <link rel="icon" href="img/logo-capuz.png" type="image/png">
</head>
<main>
    
    <header class="avatar">
    <figure class="configuracaoicon">
        <img src="/src/main/resources/static/perfil-usuario/img/iconconfig.png" alt="">
    </figure>

    <figure>
        <div class="avatar-wrapper">
            <img src="/src/main/resources/static/perfil-usuario/img/perfilicon.png" alt="avatar">
         </div>
        <h2 class="nome">NOME</h2>
    </figure>

    <section class="nivel">
        <span class="numero-nivel">Nível 1</span> 
       <progress class="progresso" value="80" max="100"></progress>
    </section>
</header>
<body> 

    <section class="geral">
        <h3>Visão Geral</h3>
        <div class="card-progresso">
            <span>Conquistas</span>
            <figure class="container">
                <img src="/src/main/resources/static/perfil-usuario/img/medalha ouro.png" width="90">
                <img src="/src/main/resources/static/perfil-usuario/img/medalha prata.png" alt="90">
                <img src="/src/main/resources/static/perfil-usuario/img/medalha verde.png" alt="">
            </figure>
        
        </div>
        <div class="xp">
            <span>XP Total</span>
            <p class="xpp">✨ 450</p> 
        </div>
        <div class="card-curso">
            
            <p class="aqui">Voce está em:</p>
           <progress class="progresso2" value="50" max="100"></progress>
            <p class="esse">Curso sobre Cibersegurança</p>
        </div>
    </section>
<footer class="rodape">
        <span class="material-symbols-outlined">
            trophy
        </span>

         <span class="material-symbols-outlined">
            book_ribbon
        </span>

        <span class="material-symbols-outlined">
            person
        </span>

    </footer>
</body>



</main>

</html>
