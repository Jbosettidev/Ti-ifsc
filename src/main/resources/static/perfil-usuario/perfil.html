<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="perfil.css">
    <link rel="icon" href="img/logo-capuz.png" type="image/png">
</head>
<main>

    <header class="avatar">
        <div class="perfil-icon">
            <a href="/src/main/resources/static/perfil-usuario/configuracoes.html" class="config-link" title="Configurações" target="_blank">
                <img src="/src/main/resources/static/perfil-usuario/img/iconconfig.png" alt="Configurações">
            </a>

            <div class="moldura">
                <img src="/src/main/resources/static/perfil-usuario/img/perfilicon.png" alt="Avatar">
            </div>
        </div>
        <h1 class="nome">NOME</h1>
    </header>

    <section class="nivel">
        <div class="card-progresso-bonitinho">
            <div class="topo-card">
                <span class="escrita-progresso">Progresso do Nível</span>
                <span class="escrita-nivel">Nível 1</span>
            </div>

            <progress class="barra-roxo" value="80" max="100"></progress>

            <div class="rodape-card">
                <span class="xp-texto">800 / 1000 XP para o próximo nível</span>
                <span class="porcentagem">80%</span>
            </div>
        </div>
    </section>
    </header>

    <body>

        <section class="geral">
            <section class="cardizinhos">
                <div class="card-pequeno">
                    <span class="numero">12</span>
                    <span class="descricao-numero">Lições</span>
                </div>

                <div class="card-pequeno">
                    <span class="numero">3</span>
                    <span class="descricao-numero">Cursos</span>
                </div>

                <div class="card-pequeno">
                    <div class="streak-wrapper">
                        <span class="numero">7</span>
                        <span class="fire-icon">🔥</span>
                    </div>
                    <span class="descricao-numero">Sequência</span>
                </div>
            </section>
            <div class="separacao-geral">
                <h1>VISÃO GERAL</h1>
                <div class="divisoria2"></div>
            </div>
            <div class="xp">

                <span>XP Total Acumulado</span>
                <p class="xpp"> 450 XP</p>

                <p class="classificação"> Iniciante</p>

            </div>
            <div class="card-progresso">
                <div class="head-progresso">
                    <span>Conquistas</span>

                </div>

                <figure class="container">
                    <img src="/src/main/resources/static/perfil-usuario/img/medalha de ouro.png" width="90">
                    <img src="/src/main/resources/static/perfil-usuario/img/medalha de prata.png" alt="90">
                    <img src="/src/main/resources/static/perfil-usuario/img/medalha verde.png" alt="">
                </figure>

            </div>
            <div class="separacao-progresso">
                <p>CURSO ATUAL</p>
                <div class="divisoria"></div>
            </div>


            <div class="card-curso">
                <div class="secureicon">
                    <figure class="moldura-secure">
                        <img src="/src/main/resources/static/perfil-usuario/img/1746650.png" alt="">
                    </figure>
                    <div class="descricao-card">
                        <p class="aqui">Você está em:</p>
                        <p>Curso de Cibersegurança</p>
                    </div>

                </div>
                <div class="head-curso">
                    <p>Progresso</p>
                    <p>50%</p>
                </div>
                <progress class="progresso2" value="50" max="100"></progress>
                <div class="esse">
                    <p>5 de 10 módulos concluídos</p>

                </div>

            </div>
        </section>
        <footer class="rodape">
            <a href="/src/main/resources/static/tela-conquistas/conquistas.html">
                <span class="material-symbols-outlined">
            trophy
        </span>

            </a>
            <a href="/src/main/resources/static/index.html">
                <span class="material-symbols-outlined">
            book_ribbon
        </span>

            </a>
            <a href="/src/main/resources/static/perfil-usuario/perfil.html">
                <span class="material-symbols-outlined">
            person
        </span>

            </a>

        </footer>
    </body>



</main>

</html>
