<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="perfil.css">
    <link rel="icon" href="img/secureicon.png" type="image/png">
</head>
<main>

    <header class="avatar">
        <div class="perfil-icon">
            <a href="configuracoes.html" class="config-link" title="Configurações">
                <img src="img/iconconfig.png" alt="Configurações">
            </a>

            <div class="moldura">
                <img src="" alt="Avatar">
            </div>
        </div>
        <h1 class="nome" id="nome">NOME</h1>
    </header>

    <section class="nivel">
        <div class="card-progresso-bonitinho">
            <div class="topo-card">
                <span class="escrita-progresso">Progresso do Nível</span>
                <span class="escrita-nivel" id="nivel">Nível 1</span>
            </div>

            <progress class="barra-roxo" id="barra-xp" value="0" max="100"></progress>

            <div class="rodape-card">
                <span class="xp-texto" id="xp-texto">0 / 1000 XP para o próximo nível</span>
                <span class="porcentagem" id="xp-pct">0%</span>
            </div>
        </div>
    </section>
    </header>

    <body>

        <section class="geral">
            <section class="cardizinhos">
                <div class="card-pequeno">
                    <span class="numero" id="licoes">0</span>
                    <span class="descricao-numero">Lições</span>
                </div>

                <div class="card-pequeno">
                    <div class="streak-wrapper">
                        <span class="numero">7</span>
                        <span class="fire-icon">🔥</span>
                    </div>
                    <span class="descricao-numero">Sequência</span>
                </div>
            </section>
            <div class="separacao-geral">
                <h1>VISÃO GERAL</h1>
                <div
