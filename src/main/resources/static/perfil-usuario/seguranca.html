<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança</title>
    <link rel="stylesheet" href="/perfil-usuario/seguranca.css">
</head>

<body>
    <main class="container-seguranca">
        <header class="topo-pagina">
            <a href="..//perfil-usuario/configuracoes.html" class="voltar-config" style="text-decoration: none;">
                <span class="setinha">←</span>
            </a>
            <h1>SEGURANÇA</h1>
        </header>
        <p class="subtitulo">Gerencie suas informações de login</p>

        <div class="formulario">
            <div class="campos">
                <label>E-mail Cadastrado</label>
                <input type="email" id="emailAtual" readonly class="input-readondely">
            </div>
            <div class="campos">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Confirme sua senha">
            </div>
            <div class="campos">
                <label>Modificar Senha</label>
                <input type="password" id="novaSenha" placeholder="Digite a nova senha">
            </div>
            <button class="botao-salvar" onclick="salvar()">Salvar alterações</button>
            <p id="msg" style="text-align:center; margin-top: 1rem;"></p>
        </div>
    </main>

    <script>
        let USER_ID = null;

        async function obterCsrf() {
            const res = await fetch('/csrf', {
                credentials: 'same-origin'
            });

            if (!res.ok) {
                throw new Error(
                    'Não foi possível obter o token de segurança.'
                );
            }

            return res.json();
        }

        async function carregarUsuario() {

            const res = await fetch('/usuarios/me', {
                credentials: 'same-origin'
            });

            if (res.status === 401 || res.status === 403) {

                localStorage.removeItem('userId');

                window.location.href = '/login';

                return;
            }

            if (!res.ok) {
                throw new Error(
                    'Não foi possível carregar o usuário.'
                );
            }

            const usuario = await res.json();

            USER_ID = usuario.id;

            localStorage.setItem(
                'userId',
                usuario.id
            );

            document.getElementById(
                'emailAtual'
            ).value = usuario.email;
        }

        async function salvar() {

            const senha =
                document.getElementById('senha').value;

            const novaSenha =
                document.getElementById('novaSenha').value;

            const msg =
                document.getElementById('msg');

            msg.textContent = '';

            if (!senha || !novaSenha) {

                msg.style.color = 'red';

                msg.textContent =
                    'Preencha a senha atual e a nova senha.';

                return;
            }

            if (novaSenha.length < 8) {

                msg.style.color = 'red';

                msg.textContent =
                    'A nova senha deve possuir pelo menos 8 caracteres.';

                return;
            }

            try {

                const csrf = await obterCsrf();

                const res = await fetch(
                    `/usuarios/${USER_ID}/seguranca`,
                    {
                        method: 'PATCH',
                        credentials: 'same-origin',

                        headers: {
                            'Content-Type': 'application/json',
                            'X-XSRF-TOKEN': csrf.token
                        },

                        body: JSON.stringify({
                            senha: senha,
                            novaSenha: novaSenha
                        })
                    }
                );

                if (res.ok) {

                    document.getElementById(
                        'senha'
                    ).value = '';

                    document.getElementById(
                        'novaSenha'
                    ).value = '';

                    msg.style.color = 'green';

                    msg.textContent =
                        'Senha atualizada com sucesso!';

                    return;
                }

                const texto = await res.text();

                try {

                    const erro = JSON.parse(texto);

                    msg.style.color = 'red';

                    msg.textContent =
                        erro.message ||
                        'Não foi possível atualizar a senha.';

                } catch {

                    msg.style.color = 'red';

                    msg.textContent =
                        'Não foi possível atualizar a senha.';
                }

            } catch (e) {

                console.error(e);

                msg.style.color = 'red';

                msg.textContent =
                    'Erro de conexão com o servidor.';
            }
        }

        carregarUsuario().catch((erro) => {

            console.error(erro);

            window.location.href = '/login';
        });
    </script>
</body>

</html>
