<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Segurança</title>
    <link rel="stylesheet" href="abas.css">
</head>

<body>
    <main class="container-seguranca">
        <header class="topo-pagina">
            <a href="configuracoes.html">
                <span class="material-symbols-outlined seta-voltar">
                line_start_arrow_notch
            </span>
            </a>
            <h1 class="titulozao">Segurança</h1>
        </header>
        <p class="subtitulo">Gerencie suas informações de login</p>

        <div class="formulario">
            <div class="campos">
                <label>E-mail Cadastrado</label>
                <input type="email" id="emailAtual" readonly class="input-readondely">
            </div>
            <div class="campos">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Confirme sua senha">
            </div>
            <div class="campos">
                <label>Modificar E-mail</label>
                <input type="email" id="novoEmail" placeholder="Digite o novo e-mail">
            </div>
            <button class="botao-salvar" onclick="salvar()">Salvar alterações</button>
            <p id="msg" style="text-align:center; margin-top: 1rem;"></p>
        </div>
    </main>

    <script>
        // criar um arquivo js 
        const USER_ID = 1; // trocar pelo id do usuário logado

        async function carregarEmail() { // Preenche o campo “E-mail Cadastrado”.
            const res = await fetch(`/usuarios/${USER_ID}`);
            if (res.ok) {
                const usuario = await res.json();
                document.getElementById('emailAtual').value = usuario.email;
            }
        }

        async function salvar() { // valida senha e novo e-mail no cliente, depois chama exatamente o endpoint acima
            const senha = document.getElementById('senha').value;
            const novoEmail = document.getElementById('novoEmail').value;
            const msg = document.getElementById('msg');
            msg.textContent = '';

            if (!senha) {
                msg.style.color = 'red';
                msg.textContent = 'Informe sua senha para continuar.';
                return;
            }

            if (!novoEmail) {
                msg.style.color = 'red';
                msg.textContent = 'Informe o novo e-mail.';
                return;
            }

            const res = await fetch(`/usuarios/${USER_ID}/seguranca`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    senha,
                    novoEmail
                })
            });

            if (res.ok) { // interpreta o corpo como JSON do usuário e atualiza o e-mail exibido e mostra sucesso.
                const usuario = await res.json();
                document.getElementById('emailAtual').value = usuario.email;
                document.getElementById('senha').value = '';
                document.getElementById('novoEmail').value = '';
                msg.style.color = 'green';
                msg.textContent = 'E-mail atualizado com sucesso!';
            } else {
                const erro = await res.text();
                msg.style.color = 'red';
                msg.textContent = erro;
            }
        }

        carregarEmail();
    </script>
</body>

</html>
