<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança</title>
    <link rel="stylesheet" href="/perfil-usuario/seguranca.css">
</head>

<body>
    <main class="container-seguranca">
        <header class="topo-pagina">
            <a href="..//perfil-usuario/configuracoes.html" class="voltar-config" style="text-decoration: none;">
                <span class="setinha">←</span>
            </a>
            <h1>SEGURANÇA</h1>
        </header>
        <p class="subtitulo">Gerencie suas informações de login</p>

        <div class="formulario">
            <div class="campos">
                <label>E-mail Cadastrado</label>
                <input type="email" id="emailAtual" readonly class="input-readondely">
            </div>
            <div class="campos">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Confirme sua senha">
            </div>
            <div class="campos">
                <label>Modificar Senha</label>
                <input type="password" id="novaSenha" placeholder="Digite a nova senha">
            </div>
            <button class="botao-salvar" onclick="salvar()">Salvar alterações</button>
            <p id="msg" style="text-align:center; margin-top: 1rem;"></p>
        </div>
    </main>

    <script>
const USER_ID = localStorage.getItem('userId');

if (!USER_ID) {
    window.location.href = '/login.html';
}

async function carregarEmail() {
    try {
        const res = await fetch(`/usuarios/${USER_ID}`);
        console.log('carregarEmail status:', res.status);

        if (res.ok) {
            const usuario = await res.json();
            console.log('usuario recebido:', usuario);
            document.getElementById('emailAtual').value = usuario.email;
        } else {
            const erro = await res.text();
            console.error('Erro ao carregar e-mail:', erro);
        }
    } catch (e) {
        console.error('Falha na requisição de carregarEmail:', e);
    }
}

async function salvar() {
    const senha = document.getElementById('senha').value;
    const novaSenha = document.getElementById('novaSenha').value;
    const msg = document.getElementById('msg');
    msg.textContent = '';

    if (!senha) {
        msg.style.color = 'red';
        msg.textContent = 'Informe sua senha para continuar.';
        return;
    }

    if (!novaSenha) {
        msg.style.color = 'red';
        msg.textContent = 'Informe a nova senha.';
        return;
    }

    try {
        const res = await fetch(`/usuarios/${USER_ID}/seguranca`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ senha, novaSenha })
        });

        console.log('salvar status:', res.status);

        if (res.ok) {
            const usuario = await res.json();
            console.log('resposta salvar:', usuario);
            document.getElementById('senha').value = '';
            document.getElementById('novaSenha').value = '';
            msg.style.color = 'green';
            msg.textContent = 'Senha atualizada com sucesso!';
        } else {
            const erro = await res.text();
            console.error('Erro ao salvar:', erro);
            msg.style.color = 'red';
            msg.textContent = erro || `Erro ${res.status} ao salvar alterações.`;
        }
    } catch (e) {
        console.error('Falha na requisição de salvar:', e);
        msg.style.color = 'red';
        msg.textContent = 'Erro de conexão com o servidor.';
    }
}

carregarEmail(); 
 </script>
</body>

</html>
