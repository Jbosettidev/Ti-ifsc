<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo-capuz.png" type="image/png">
</head>

<body>
    <form id="form-cadastro">
        <div class="card-total">
            <img src="img/logo-capuz.png" class="imagem" alt="Logo">
            <h2 class="titulo">Cadastre-se</h2>
            <div class="inputbox">
                <input type="text" id="nome" placeholder="Nome completo" name="nome" required minlength="3" maxlength="50">
                <ion-icon name="man" class="icone"></ion-icon>
            </div>
            <div class="inputbox">
                <input type="text" id="nome-usuario" placeholder="Nome de usuário" name="nomeusuario" required minlength="5" maxlength="50">
                <ion-icon name="man" class="icone"></ion-icon>
            </div>
            <div class="inputbox">
                <input type="email" id="email" placeholder="Email" name="email" required maxlength="150">
                <ion-icon class="icone" name="mail"></ion-icon>
            </div>
            <div class="inputbox">
                <input type="password" id="senha" placeholder="Senha" name="senha" required minlength="8" maxlength="50">
                <ion-icon class="icone" id="toggleSenha" name="eye-outline"></ion-icon>
            </div>
            <div class="inputbox">
                <input type="password" id="senha-confirmada" placeholder="Confirmar senha" name="senha-confirmada" required minlength="8" maxlength="50">
                <ion-icon class="icone" name="key"></ion-icon>
            </div>
            <a href="login.html" class="botao-secundario">Já possui uma conta?</a>
            <div class="botao-container">
                <input type="submit" class="botao" id="botao-cadastro" value="Cadastrar">
            </div>
            <p id="msg" style="text-align: center; margin-top: 1rem; color: #26215C; font-weight: 600;"></p>
        </div>
    </form>
    <canvas id="bolhas"></canvas>

    <script>
        const form = document.getElementById('form-cadastro');
        const msg = document.getElementById('msg');
        const botao = document.getElementById('botao-cadastro');
        const apiUrl = window.location.origin + '/usuarios';

        // Quem já tem conta não precisa passar pelo cadastro de novo
        if (localStorage.getItem('userId')) {
            window.location.replace('../index.html');
        }

        if (window.location.protocol === 'file:') {
            msg.style.color = '#a80a0a';
            msg.textContent = 'Abra esta página pelo servidor: http://localhost:8080/TelasIniciais/cadastro.html';
        }

        function mostrarErro(texto) {
            msg.style.color = '#a80a0a';
            msg.textContent = texto;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.textContent = '';

            if (window.location.protocol === 'file:') {
                mostrarErro('Use http://localhost:8080/TelasIniciais/cadastro.html (não abra o arquivo direto).');
                return;
            }

            const nome = document.getElementById('nome').value.trim();
            const nomeusuario = document.getElementById('nome-usuario').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('senha-confirmada').value;

            if (!nomeusuario) {
                mostrarErro('Informe o nome de usuário.');
                return;
            }

            if (senha !== confirmar) {
                mostrarErro('As senhas não coincidem.');
                return;
            }

            botao.disabled = true;
            botao.value = 'Cadastrando...';

            try {
                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, nomeusuario, email, senha })
                });

                const texto = await res.text();

                if (res.ok) {
                    const usuario = JSON.parse(texto);
                    localStorage.setItem('userId', usuario.id);
                    msg.style.color = '#1a7a3a';
                    msg.textContent = 'Cadastro realizado! Redirecionando...';
                    setTimeout(() => { window.location.href = '../index.html'; }, 800);
                    return;
                }

                try {
                    const erro = JSON.parse(texto);
                    if (erro.errors?.length) {
                        mostrarErro(erro.errors.map(err => err.message || err.field).join(' · '));
                    } else {
                        mostrarErro(erro.message || texto);
                    }
                } catch {
                    mostrarErro(texto || 'Não foi possível cadastrar.');
                }
            } catch {
                mostrarErro('Erro de conexão. O Spring Boot está rodando na porta 8080?');
            } finally {
                if (msg.textContent !== 'Cadastro realizado! Redirecionando...') {
                    botao.disabled = false;
                    botao.value = 'Cadastrar';
                }
            }
        });

        const canvas = document.getElementById('bolhas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        let bolhas = [];
        setInterval(() => {
            if (bolhas.length < 60) {
                bolhas.push(novaBolha());
            }
        }, 800);

        function novaBolha(x, y) {
            return {
                x: x ?? Math.random() * canvas.width,
                y: y ?? canvas.height + Math.random() * 200,
                r: 3 + Math.random() * 10,
                velocidade: 0.4 + Math.random() * 0.10,
                opacidade: 0.08 + Math.random() * 0.08,
                drift: (Math.random() - 0.5) * 0.4
            };
        }

        window.addEventListener('mousemove', (e) => {
            if (bolhas.length < 60) {
                bolhas.push(novaBolha(e.clientX, e.clientY));
            }
        });

        window.addEventListener('click', (e) => {
            for (let i = 0; i < 12; i++) {
                bolhas.push(novaBolha(
                    e.clientX + (Math.random() - 0.5) * 60,
                    e.clientY + (Math.random() - 0.5) * 60
                ));
            }
        });

        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            bolhas.forEach((b, i) => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${b.opacidade})`;
                ctx.fill();

                b.y -= b.velocidade;
                b.x += b.drift;

                if (b.y + b.r < 0) bolhas.splice(i, 1);
            });

            requestAnimationFrame(animar);
        }

        animar();
    </script>

    <script src="senha.js"></script>
</body>

</html>
