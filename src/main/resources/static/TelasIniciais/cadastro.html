<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureByte - Cadastroo</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo-capuz.png" type="image/png">
</head>

<body>
    <img src="img/Fundo.png" class="fundo">

    <div class="card-total">
        <img src="img/logo-capuz.png" class="imagem">
        <h2>CADASTRE-SE</h2>

        <div class="inputbox">
            <input type="text" placeholder="Nome completo" id="nome">
            <ion-icon name="man" class="icone"></ion-icon>
        </div>

        <div class="inputbox">
            <input type="text" placeholder="Apelido">
            <ion-icon name="man" class="icone"></ion-icon>
        </div>

        <div class="inputbox">
            <input type="text" placeholder="Nome de usuário" id="nome-usuario">
            <ion-icon name="man" class="icone"></ion-icon>
        </div>

        <div class="inputbox">
            <input type="email" placeholder="Email" required>
            <ion-icon class="icone" name="mail"></ion-icon>
        </div>

        <div class="inputbox">
            <input type="password" placeholder="Senha" required>
            <ion-icon class="icone" name="key"></ion-icon>
        </div>

        <div class="inputbox">
            <input type="password" placeholder="Confirmar senha" required>
            <ion-icon class="icone" name="key"></ion-icon>
        </div>

        <a href="login.html" class="botao-secundario">Já possui uma conta?</a>

        <div class="botao-container">
            <button class="botao" id="botao-login">Cadastrar</button>

        </div>
    </div>
</body>

</html>
