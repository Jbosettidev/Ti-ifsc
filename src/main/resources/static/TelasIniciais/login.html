<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <link rel="stylesheet" href="/TelasIniciais/style.css">
    <link rel="icon" href="/TelasIniciais/img/logo-capuz.png" type="image/png">
</head>

<body>
    <form id="form-login" action="/login" method="post">
        <div class="card-total">
            <img src="/TelasIniciais/img/logo-capuz.png" class="imagem" alt="Logo">
            <h2 class="titulo">Bem vindo de volta!</h2>

            <div class="inputbox">
                <input type="email" id="email" name="email" placeholder="Email" required>
                <ion-icon class="icone" name="mail"></ion-icon>
            </div>
            <div class="inputbox">
                <input type="password" id="senha" name="senha" placeholder="Senha" required minlength="8">
                <ion-icon class="icone toggleSenha" name="eye-off-outline"></ion-icon>
            </div>

            <a href="/TelasIniciais/senha1.html" class="botao-secundario">Esqueceu a senha?</a>

            <div class="botao-container">
                <input type="submit" class="botao" id="botao-login" value="Entrar">
                <input type="button" onclick="window.location.href='/TelasIniciais/cadastro.html';" class="botao" value="Cadastrar">
            </div>

            <div id="msg" style="text-align: center; margin-top: 1rem; font-weight: 600;">
                <span id="mensagemErro"></span>
            </div>
        </div>
    </form>
    <canvas id="bolhas"></canvas>

    <script src="/TelasIniciais/senha.js"></script>
    <script>
        // ===================== MENSAGENS DE ERRO/SUCESSO =====================
        const msg = document.getElementById('mensagemErro');
        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.get('error')) {
            msg.style.color = '#a80a0a';
            msg.textContent = 'E-mail ou senha incorretos.';
        } else if (urlParams.get('logout')) {
            msg.style.color = '#1a7a3a';
            msg.textContent = 'Você saiu com sucesso!';
        }

        // ===================== REDIRECIONAR SE JÁ LOGADO =====================
        // COMENTADO para não redirecionar automaticamente
        // if (localStorage.getItem('userId')) {
        //     window.location.replace('/TelasIniciais/index.html');
        // }

        // ===================== BOLHAS =====================
        const canvas = document.getElementById('bolhas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        let bolhas = [];
        setInterval(() => {
            if (bolhas.length < 60) {
                bolhas.push(novaBolha());
            }
        }, 800);

        function novaBolha(x, y) {
            return {
                x: x ?? Math.random() * canvas.width,
                y: y ?? canvas.height + Math.random() * 200,
                r: 3 + Math.random() * 8,
                velocidade: 0.4 + Math.random() * 0.10,
                opacidade: 0.08 + Math.random() * 0.08,
                drift: (Math.random() - 0.5) * 0.4
            };
        }

        window.addEventListener('mousemove', (e) => {
            if (bolhas.length < 60) {
                bolhas.push(novaBolha(e.clientX, e.clientY));
            }
        });

        window.addEventListener('click', (e) => {
            if (e.target.closest('#form-login')) return;
            for (let i = 0; i < 12; i++) {
                bolhas.push(novaBolha(
                    e.clientX + (Math.random() - 0.5) * 60,
                    e.clientY + (Math.random() - 0.5) * 60
                ));
            }
        });

        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            bolhas.forEach((b, i) => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${b.opacidade})`;
                ctx.fill();

                b.y -= b.velocidade;
                b.x += b.drift;

                if (b.y + b.r < 0) bolhas.splice(i, 1);
            });

            requestAnimationFrame(animar);
        }

        animar();

        // ===================== TOGGLE SENHA =====================
        document.querySelector('.toggleSenha')?.addEventListener('click', function() {
            const input = document.getElementById('senha');
            if (input.type === 'password') {
                input.type = 'text';
                this.name = 'eye-outline';
            } else {
                input.type = 'password';
                this.name = 'eye-off-outline';
            }
        });
    </script>
</body>

</html>
