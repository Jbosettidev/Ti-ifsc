<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <link rel="stylesheet" href="/TelasIniciais/style.css">
    <link rel="icon" href="/TelasIniciais/img/logo-capuz.png" type="image/png">
</head>

<body>
    <form id="form-login" action="/login" method="post">
        <div class="card-total">
            <img src="/TelasIniciais/img/logo-capuz.png" class="imagem" alt="Logo">
            <h2 class="titulo">Bem vindo de volta!</h2>

            <div class="inputbox">
                <input type="email" id="email" placeholder="Email" required>
                <ion-icon class="icone" name="mail"></ion-icon>
            </div>
            <div class="inputbox">
                <input type="password" id="senha" placeholder="Senha" required minlength="8">
                <ion-icon class="icone toggleSenha" name="eye-off-outline"></ion-icon>
            </div>

            <a href="/senha1" class="botao-secundario">Esqueceu a senha?</a>

            <div class="botao-container">
                <input type="submit" class="botao" id="botao-login" value="Entrar">
                <input type="button" onclick="window.location.href='/cadastro';" class="botao" value="Cadastrar">
            </div>
            <p id="msg" style="text-align: center; margin-top: 1rem; color: #26215C; font-weight: 600;"></p>
        </div>
    </form>
    <canvas id="bolhas"></canvas>

    <script src="/TelasIniciais/senha.js"></script>
    <script>
        const form = document.getElementById('form-login');
        const msg = document.getElementById('msg');
        const botao = document.getElementById('botao-login');

        const urlParams =
            new URLSearchParams(window.location.search);

        if (urlParams.get('error')) {

            msg.style.color = '#a80a0a';

            msg.textContent =
                'E-mail ou senha incorretos.';

        } else if (urlParams.get('logout')) {

            msg.style.color = '#1a7a3a';

            msg.textContent =
                'Você saiu com sucesso!';
        }

        async function obterCsrf() {

            const res = await fetch('/csrf', {
                credentials: 'same-origin'
            });

            if (!res.ok) {
                throw new Error(
                    'Não foi possível obter o token CSRF.'
                );
            }

            return res.json();
        }

        form.addEventListener('submit', async (e) => {

            e.preventDefault();

            msg.textContent = '';

            const email =
                document.getElementById('email').value.trim();

            const senha =
                document.getElementById('senha').value;

            botao.disabled = true;
            botao.value = 'Entrando...';

            try {

                const csrf = await obterCsrf();

                const dados = new URLSearchParams();

                dados.set('email', email);
                dados.set('senha', senha);

                const login = await fetch('/login', {
                    method: 'POST',

                    credentials: 'same-origin',

                    headers: {
                        'Content-Type':
                            'application/x-www-form-urlencoded',

                        'X-XSRF-TOKEN':
                        csrf.token
                    },

                    body: dados
                });

                if (!login.ok) {

                    window.location.href =
                        '/login?error=true';

                    return;
                }

                const usuarioRes =
                    await fetch('/usuarios/me', {
                        credentials: 'same-origin'
                    });

                if (!usuarioRes.ok) {

                    throw new Error(
                        'Não foi possível recuperar o usuário.'
                    );
                }

                const usuario =
                    await usuarioRes.json();

                localStorage.setItem(
                    'userId',
                    usuario.id
                );

                window.location.href = '/';

            } catch (erro) {

                console.error(erro);

                msg.style.color = '#a80a0a';

                msg.textContent =
                    'Não foi possível realizar o login.';

                botao.disabled = false;

                botao.value = 'Entrar';
            }
        });
    </script>
</body>

</html>
