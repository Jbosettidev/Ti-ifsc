<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureByte - Verificar Código</title>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo-capuz.png" type="image/png">
</head>

<body>

    <div class="card-total">
        <img src="img/logo-capuz.png" class="imagem">
        <h2 class="titulo">VERIFICAÇÃO</h2>
        <p class="titulo" id="p">Insira o código de 6 dígitos enviado para seu e-mail.</p>

        <div class="inputbox">
            <input type="text" id="input-codigo" inputmode="numeric" maxlength="6" placeholder="······" required>
            <ion-icon class="icone" name="keypad-outline"></ion-icon>
        </div>

        <div class="botao-container">
            <button onclick="window.location.href='nova-senha.html';" class="botao">Verificar</button>
            <button onclick="window.location.href='senha1.html';" class="botao" id="voltar">Voltar</button>
        </div>
        
        <p class="esqueceu-senha" style="margin-top: 20px; display: block;">
            Não recebeu? <a href="#" style="color: var(--ciano); font-weight: bold;">Reenviar</a>
        </p>
    </div>
</body>
</html>
