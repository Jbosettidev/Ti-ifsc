<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquistas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="/tela-conquistas/conquistas.css">
    <link rel="icon" href="/tela-conquistas/TelasIniciais/img/logo-capuz.png" type="image/png">

</head>

<body>

    <header class="caixa_conquistas">
        <h1>Conquistas </h1>

        <p>Continue aprendendo para desbloquear novas medalhas e subir de nível.</p>

        <div class="barra-de-progresso">
            <span id="resumo-medalhas">Carregando...</span>
            <span id="resumo-percentual"></span>

        </div>

        <progress id="barra-medalhas" value="0" max="100"></progress>

        <div class="linha-divisoria"> </div>

        <div class="progresso">
            <h2><span id="stat-medalhas">–</span>
                <p>MEDALHAS</p>
            </h2>
            <div class="divisor-vertical"></div>

            <h2><span id="stat-rank">–</span>
                <p>RANK</p>
            </h2>
            <div class="divisor-vertical"></div>

            <h2><span id="stat-acertos">–</span>
                <p>ACERTOS</p>
            </h2>

        </div>

    </header>

    <h4 class="titulo-medalhas">✦ Suas medalhas ✦</h4>
    <div class="container">

        <p id="estado-conquistas" class="estado-conquistas">Carregando suas conquistas...</p>

        <footer class="rodape">
            <a href="/conquistas">
                <span class="material-symbols-outlined">
                    trophy
                </span>

            </a>
            <a href="/">
                <span class="material-symbols-outlined">
                    book_ribbon
                </span>
            </a>
            <a href="/perfil-usuario/perfil.html">
                <span class="material-symbols-outlined">
                    person
                </span>
            </a>

        </footer>
    <script src="/tela-conquistas/conquistas.js"></script>
</body>

</html>
